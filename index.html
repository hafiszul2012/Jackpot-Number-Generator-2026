
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jackpot MY 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial}
header{text-align:center;background:#151515;padding:24px}
h1{color:#e9bd52;margin:0;font-size:24px}
header p{color:#aaa;font-size:12px}
main{max-width:600px;margin:auto;padding:15px}
.card{background:#171717;border:1px solid #333;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;color:#d9b44a;margin:10px 0}
select,input{width:100%;padding:13px;background:#222;color:white;border:1px solid #444;border-radius:8px}
button{border:0;border-radius:9px;padding:13px;font-weight:bold;cursor:pointer}
.gold{background:#d8b247;color:#111;width:100%;margin-top:12px}
.small{background:#333;color:#e8bd50;margin:4px}
.numbers{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.ball{background:#d9b348;color:#111;width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.result{background:#101010;border:1px solid #393939;border-radius:10px;padding:12px;margin-top:12px}
h3{color:#e4bb4d}
footer{text-align:center;color:#777;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
<h1>🎰 JACKPOT MY 2026</h1>
<p>RANDOM NUMBER GENERATOR • MALAYSIA</p>
</header>
<main>
<div class="card">
<label>🎯 PILIH PERMAINAN</label>
<select id="game">
<option value="58">SPORT TOTO 6/58</option>
<option value="55">SPORT TOTO 6/55</option>
<option value="4d">MAGNUM 4D</option>
<option value="6d">MAGNUM 6D JACKPOT</option>
</select>
<label>📊 BILANGAN SET</label>
<select id="sets">
<option>5</option><option>10</option>
<option>20</option><option>50</option>
</select>
<button class="gold" onclick="generate()">🎲 JANA NOMBOR</button>
</div>

<div class="card">
<h3>✨ KEPUTUSAN RANDOM</h3>
<div id="result">Tekan JANA NOMBOR untuk mula.</div>
<button class="small" onclick="copyAll()">📋 SALIN</button>
<button class="small" onclick="saveFav()">⭐ SIMPAN FAVORITE</button>
</div>

<div class="card">
<h3>⭐ FAVORITE</h3>
<div id="fav">Belum ada nombor disimpan.</div>
</div>

<div class="card">
<h3>🕘 HISTORY</h3>
<div id="history">Belum ada sejarah.</div>
<button class="small" onclick="clearHistory()">PADAM HISTORY</button>
</div>
</main>
<footer>
Nombor dijana secara rawak sahaja. Tiada jaminan kemenangan.
</footer>

<script>
let latest=[];
function generate(){
let game=document.getElementById('game').value;
let count=Number(document.getElementById('sets').value);
let result=document.getElementById('result');
latest=[];
result.innerHTML='';
for(let i=0;i<count;i++){
let nums=[];
if(game==='58'||game==='55'){
let max=Number(game);
while(nums.length<6){
let n=Math.floor(Math.random()*max)+1;
if(!nums.includes(n))nums.push(n);
}
nums.sort((a,b)=>a-b);
}else{
let digits=game==='4d'?4:6;
nums=[Array.from({length:digits},()=>Math.floor(Math.random()*10)).join('')];
}
latest.push(nums);
let div=document.createElement('div');
div.className='result';
div.innerHTML='<b>SET '+(i+1)+'</b><div class="numbers">'+nums.map(n=>'<span class="ball">'+String(n).padStart(game==='58'||game==='55'?2:game==='4d'?4:6,'0')+'</span>').join('')+'</div>';
result.appendChild(div);
}
let h=JSON.parse(localStorage.getItem('hist')||'[]');
h.unshift({game:document.getElementById('game').selectedOptions[0].text,sets:latest});
localStorage.setItem('hist',JSON.stringify(h.slice(0,10)));
showHistory();
}
function copyAll(){
let t=latest.map((a,i)=>'SET '+(i+1)+': '+a.join(' - ')).join('\n');
if(t)navigator.clipboard?.writeText(t).then(()=>alert('Nombor disalin!')).catch(()=>alert(t));
}
function saveFav(){
if(!latest.length)return alert('Jana nombor dahulu');
let f=JSON.parse(localStorage.getItem('fav')||'[]');
f.unshift(latest);
localStorage.setItem('fav',JSON.stringify(f.slice(0,10)));
showFav();alert('Favorite disimpan!');
}
function showFav(){
let f=JSON.parse(localStorage.getItem('fav')||'[]');
document.getElementById('fav').innerHTML=f.length?f.map(x=>'<div class="result">'+x.map(a=>a.join('-')).join('<br>')+'</div>').join(''):'Belum ada nombor disimpan.';
}
function showHistory(){
let h=JSON.parse(localStorage.getItem('hist')||'[]');
document.getElementById('history').innerHTML=h.length?h.map(x=>'<div class="result">'+x.game+'<br>'+x.sets.map(a=>a.join('-')).join('<br>')+'</div>').join(''):'Belum ada sejarah.';
}
function clearHistory(){localStorage.removeItem('hist');showHistory();}
showFav();showHistory();
</script>
</body>
</html>
