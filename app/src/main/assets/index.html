
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jackpot MY 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial}
header{background:#151515;padding:22px;text-align:center;border-bottom:1px solid #333}
h1{color:#e9bd52;margin:0;font-size:23px}
header p{color:#aaa;font-size:12px}
main{padding:16px;max-width:600px;margin:auto}
.card{background:#171717;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:15px}
label{display:block;color:#d9b44a;margin-bottom:8px}
select,input{width:100%;padding:13px;background:#222;color:white;border:1px solid #444;border-radius:8px;margin-bottom:13px}
button{border:0;border-radius:8px;padding:13px;font-weight:bold;background:#333;color:#fff;margin:4px 0}
.gold{background:#d9b348;color:#111;width:100%}
.numbers{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ball{background:#d9b348;color:#111;width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.result{background:#101010;border:1px solid #444;border-radius:8px;padding:12px;margin-top:10px}
h3{color:#e9bd52}
footer{text-align:center;color:#777;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
<h1>🎰 JACKPOT MY 2026</h1>
<p>RANDOM NUMBER GENERATOR • MALAYSIA</p>
</header>
<main>
<div class="card">
<label>🎯 PILIH PERMAINAN</label>
<select id="game">
<option value="58">SPORT TOTO 6/58</option>
<option value="55">SPORT TOTO 6/55</option>
<option value="4">MAGNUM 4D</option>
<option value="6">MAGNUM 6D JACKPOT</option>
</select>

<label>📦 JUMLAH SET</label>
<select id="sets">
<option>5</option>
<option>10</option>
<option>20</option>
<option>50</option>
</select>

<button class="gold" onclick="generate()">🎲 JANA NOMBOR</button>
</div>

<div class="card">
<h3>✨ KEPUTUSAN</h3>
<div id="output">Tekan JANA NOMBOR untuk mula.</div>
<button onclick="saveFav()">⭐ SIMPAN KEGEMARAN</button>
<button onclick="copyAll()">📋 SALIN NOMBOR</button>
</div>

<div class="card">
<h3>⭐ KEGEMARAN</h3>
<div id="fav">Belum ada nombor disimpan.</div>
</div>

<div class="card">
<h3>🕘 SEJARAH</h3>
<div id="history">Belum ada sejarah.</div>
</div>
<footer>
Nombor dijana secara rawak sahaja.<br>
Tiada jaminan kemenangan. Main secara bertanggungjawab.
</footer>
</main>
<script>
let latest=[];
function generate(){
let game=document.getElementById("game").value;
let count=Number(document.getElementById("sets").value);
latest=[];
let html="";
for(let s=0;s<count;s++){
let nums=[];
if(game==="58"||game==="55"){
let max=Number(game);
while(nums.length<6){
let n=Math.floor(Math.random()*max)+1;
if(!nums.includes(n))nums.push(n);
}
nums.sort((a,b)=>a-b);
}else{
let digits=game==="4"?4:6;
let n="";
for(let i=0;i<digits;i++)n+=Math.floor(Math.random()*10);
nums=[n];
}
latest.push(nums);
html+='<div class="result"><b>SET '+(s+1)+'</b><div class="numbers">';
nums.forEach(n=>html+='<span class="ball">'+String(n).padStart(game==="4"||game==="6"?Number(game):2,"0")+'</span>');
html+='</div></div>';
}
document.getElementById("output").innerHTML=html;
let h=JSON.parse(localStorage.getItem("history")||"[]");
h.unshift({game:document.getElementById("game").selectedOptions[0].text,sets:count,nums:latest});
h=h.slice(0,10);
localStorage.setItem("history",JSON.stringify(h));
showHistory();
}
function saveFav(){
if(!latest.length)return alert("Jana nombor dahulu.");
let f=JSON.parse(localStorage.getItem("fav")||"[]");
f.unshift(latest);
localStorage.setItem("fav",JSON.stringify(f));
showFav();
}
function showFav(){
let f=JSON.parse(localStorage.getItem("fav")||"[]");
document.getElementById("fav").innerHTML=f.length?f.map(x=>'<div class="result">'+x.map(n=>n.join(" - ")).join("<br>")+'</div>').join(""):"Belum ada nombor disimpan.";
}
function showHistory(){
let h=JSON.parse(localStorage.getItem("history")||"[]");
document.getElementById("history").innerHTML=h.length?h.map(x=>'<div class="result">'+x.game+'<br>'+x.nums.map(n=>n.join(" - ")).join("<br>")+'</div>').join(""):"Belum ada sejarah.";
}
function copyAll(){
if(!latest.length)return alert("Jana nombor dahulu.");
let t=latest.map((n,i)=>"Set "+(i+1)+": "+n.join(" - ")).join("\n");
if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Nombor disalin!"));
else alert(t);
}
showFav();showHistory();
</script>
</body>
</html>
